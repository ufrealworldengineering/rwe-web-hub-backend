services:
  postgres_test:
    image: postgres:16
    container_name: rwehub_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rwehub_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rwehub_test"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - rwehub_test_pgdata:/var/lib/postgresql/data

volumes:
  rwehub_test_pgdata:

